<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Try the Look — Runway</title>
<meta name="description" content="Six looks, styled head to toe. Explore the runway, isolate a look, and tap a pin to see the piece.">
<link rel="preload" as="image" href="https://reel-ref-try-the-look.vercel.app/assets/model-1-640.webp" fetchpriority="high">
<style>
@font-face{font-family:Inter;src:url(https://reel-ref-try-the-look.vercel.app/assets/inter-600.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;font-family:Helvetica,Arial,sans-serif;color:#151413;background:#fff}
body{overflow-x:hidden}
:root{color-scheme:light}
button,input,select{font:inherit}
a{color:inherit;text-decoration:none}
button{color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid #151413;outline-offset:4px}
[hidden]{display:none !important}

/* header */
.site-header{height:88px;padding:0 40px;display:flex;align-items:center;gap:32px;border-bottom:1px solid #e4e4e4;background:#fff;position:relative;z-index:50}
.brand{margin-right:auto;display:inline-flex}
.brand img{display:block;width:68px;height:24px;object-fit:contain}
.site-header nav{display:flex;gap:28px;font-family:Inter,Helvetica,Arial,sans-serif;font-size:14px;font-weight:600}
.site-header nav a{padding:12px 0}
.site-header nav a:hover{text-decoration:underline;text-underline-offset:4px}
#open-bag{display:flex;align-items:center;justify-content:center;gap:5px;background:none;border:0;min-width:44px;min-height:44px;cursor:pointer}
#open-bag span{font-size:10px}

/* section tokens */
runway-section{
  --rw-ease:cubic-bezier(.16,1,.3,1);
  --rw-ease-silk:cubic-bezier(.65,0,.35,1);
  --rw-ease-spring:cubic-bezier(.34,1.56,.64,1);
  --rw-ease-sheet:cubic-bezier(.32,.72,0,1);
  --rw-stage:#fff;--rw-panel:#fff;--rw-text:#151413;--rw-muted:#66625c;--rw-accent:#0e0e0e;--rw-on-accent:#fff;--rw-line:#c8c8c8;
  --rw-model-h:560px;--rw-fs:1;--rw-hx:72%;--rw-hy:30px;
  --rw-panel-w:380px;--rw-panel-pad:32px;
  --rw-h:46px;--rw-sub:12px;--rw-chip:17px;--rw-ph:18px;--rw-pt:13px;--rw-price:12px;--rw-opt:11px;--rw-total:16px;--rw-thumb:92px;--rw-label:10px;
  --rw-add-radius:20px;--rw-pill-radius:30px;
  display:block;position:relative;color:var(--rw-text);background:var(--rw-panel);-webkit-font-smoothing:antialiased;
}
.rw__sticky{height:var(--rw-frame-h,100svh);display:flex;flex-direction:column}
.rw__grid{display:grid;grid-template-columns:minmax(0,1fr) var(--rw-panel-w);grid-template-rows:minmax(0,1fr);width:100%;flex:1 1 auto;min-height:0}
.rw__left{position:relative;display:flex;flex-direction:column;background:var(--rw-stage);overflow:hidden}
.rw__panel{background:var(--rw-panel);border-left:1px solid var(--rw-line);position:relative}
.rw__panel-inner{position:absolute;inset:0;display:flex;flex-direction:column}

/* head */
.rw__head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:44px 56px 0;z-index:5}
.rw__intro{display:flex;flex-direction:column;gap:12px;max-width:640px}
.rw__title{margin:0;font-weight:400;font-size:var(--rw-h);line-height:1;letter-spacing:-.02em;color:#151413}
.rw__sub{margin:0;font-size:var(--rw-sub);line-height:1.55;color:#66625c;max-width:46ch}
.rw__sr{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);white-space:nowrap;overflow:hidden}

/* stage */
.rw__stage{position:relative;flex:1 1 auto;min-height:0;touch-action:pan-y;user-select:none;cursor:grab;outline:none;overflow:hidden;z-index:0}
.rw--dragging .rw__stage{cursor:grabbing}
.rw__stage:focus-visible{box-shadow:inset 0 0 0 2px #0e0e0e}
.rw__actors,.rw__heroes{position:absolute;inset:0}
.rw__heroes{pointer-events:none;z-index:1500}
.rw__sweep{position:absolute;inset:0;z-index:1550;mix-blend-mode:soft-light;pointer-events:none}
.rw__sweep::before{content:"";position:absolute;top:-20%;bottom:-20%;width:42%;transform:translateX(-130%) skewX(-12deg);opacity:0;background:linear-gradient(100deg,transparent,rgb(255 255 255/.25) 42%,rgb(255 255 255/.55) 50%,rgb(255 255 255/.25) 58%,transparent)}
.rw--sweep .rw__sweep::before{animation:rw-sweep 1.5s var(--rw-ease-silk)}
@keyframes rw-sweep{0%{transform:translateX(-130%) skewX(-12deg);opacity:0}18%{opacity:1}100%{transform:translateX(330%) skewX(-12deg);opacity:0}}

.rw__model{position:absolute;left:0;bottom:0;transform-origin:50% 100%;will-change:transform,opacity;opacity:0}
.rw__shadow{position:absolute;left:58%;bottom:0;width:150%;height:9%;min-height:14px;max-height:46px;transform:translate(-50%,50%);filter:blur(2px);background:radial-gradient(closest-side,rgb(20 16 12/.30),rgb(20 16 12/.14) 45%,rgb(20 16 12/.04) 75%,rgb(20 16 12/0))}
.rw__figure{position:relative;height:var(--rw-model-h);aspect-ratio:var(--rw-ar,.5625)}
.rw__art{position:absolute;inset:0;transform:translateY(calc(var(--rw-foot,0) * 100%))}
.rw__art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;pointer-events:none;opacity:0}
.rw__art img.is-decoded{opacity:1}
.rw__hit{position:absolute;inset:0;z-index:1;background:transparent;border:0;border-radius:24px;cursor:pointer}
.rw__hit:focus-visible{outline:2px solid var(--rw-accent);outline-offset:6px}

/* heroes */
.rw__hero{position:absolute;left:var(--rw-hx,72%);bottom:var(--rw-hy,30px);transform:translateX(-50%) scale(var(--rw-fs,1));transform-origin:50% 100%}
.rw__morph{position:relative}
.rw__hero .rw__morph{opacity:0;visibility:hidden}
.rw--still .rw__hero.is-on .rw__morph{opacity:1;visibility:visible}
.rw__zoom{position:absolute;inset:0;z-index:1;background:transparent;border:0;border-radius:24px;cursor:zoom-in}
.rw__pins{position:absolute;inset:0}
.rw--popup .rw__heroes .rw__pin{display:none !important}
.rw__pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;background:transparent;border:0;cursor:pointer}
.rw__pin-dot{position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.86);backdrop-filter:blur(6px);color:#151413;font-size:11px;font-weight:600;line-height:1;box-shadow:0 4px 14px -4px rgb(0 0 0/.35);transition:transform .5s cubic-bezier(.2,1.6,.4,1),background .25s,color .25s}
.rw__pin-dot::after,.rw__pin-dot::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgb(255 255 255/.8)}
.rw__pin-dot::after{animation:rw-ring 2.6s cubic-bezier(.2,.6,.3,1) infinite}
.rw__pin-dot::before{border-color:rgb(255 255 255/.55);animation:rw-ring 2.6s cubic-bezier(.2,.6,.3,1) 1.3s infinite}
@keyframes rw-ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.rw__pin:hover .rw__pin-dot,.rw__pin.is-hot .rw__pin-dot{transform:scale(1.3);background:#0e0e0e;color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,#0e0e0e 22%,transparent),0 8px 20px -6px rgb(0 0 0/.45)}
.rw__pin::after{content:attr(data-tip);position:absolute;left:calc(100% - 6px);top:50%;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 12px;border-radius:999px;background:rgb(255 255 255/.88);backdrop-filter:blur(10px);color:#151413;font-size:11px;font-weight:500;letter-spacing:.04em;line-height:1;box-shadow:0 10px 26px -12px rgb(0 0 0/.4);opacity:0;transform:translate(-8px,-50%) scale(.96);transform-origin:left;transition:opacity .35s,transform .6s var(--rw-ease);pointer-events:none}
.rw__pin:hover::after,.rw__pin.is-hot::after,.rw__pin:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.rw__lb .rw__pin{display:grid}
.rw__lb .rw__pin-dot{animation:rw-pin-in .9s var(--rw-ease-spring) backwards;animation-delay:calc(var(--pi) * 110ms + .6s)}
@keyframes rw-pin-in{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

/* controls */
.rw__controls{display:flex;align-items:center;gap:20px;padding:6px 44px 30px;z-index:5}
.rw__icon{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:#151413;position:relative;cursor:pointer}
.rw__icon::before{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--rw-ease),opacity .4s}
.rw__icon:hover::before{opacity:.22;transform:scale(1)}
.rw__icon svg{transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.rw__icon:active svg{transform:scale(.88)}
[data-rw-prev]:hover svg{transform:translateX(-4px)}
[data-rw-next]:hover svg{transform:translateX(4px)}
.rw__ticks{flex:1;display:flex;gap:6px;min-width:0}
.rw__tick{flex:0 1 44px;min-width:14px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:9px;color:#66625c;text-align:left;border:0;background:none;cursor:pointer;transition:flex-basis .8s cubic-bezier(.2,1.25,.3,1),color .3s}
.rw__tick[aria-current="true"]{flex:0 0 190px;color:#151413}
.rw__tick:hover{color:#151413}
.rw__tick:hover .rw__tick-bar{transform:scaleY(1.5)}
.rw__tick-bar{position:relative;height:2px;width:100%;overflow:hidden;background:color-mix(in srgb,#151413 14%,transparent);transition:transform .5s var(--rw-ease)}
.rw__tick-bar::after{content:"";position:absolute;inset:0;background:#151413;transform:scaleX(0);transform-origin:left;transition:transform 1s var(--rw-ease),opacity .4s,background .4s}
.rw__tick.is-past .rw__tick-bar::after{transform:scaleX(1);opacity:.35}
.rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(1);opacity:1;background:#0e0e0e}
.rw--playing .rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(0)}
.rw--playing .rw__tick[aria-current="true"].is-run .rw__tick-bar::after{animation:rw-fill var(--rw-speed,5s) linear forwards}
@keyframes rw-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rw__tick-label{font-size:10px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rw__tick-name{display:none}
.rw__tick[aria-current="true"] .rw__tick-name{display:inline;animation:rw-name-in 1.1s var(--rw-ease) .1s backwards}
@keyframes rw-name-in{from{opacity:0;letter-spacing:.34em}to{opacity:1;letter-spacing:0}}
.rw__auto svg+svg{display:none}
.rw--playing .rw__auto svg:first-child{display:none}
.rw--playing .rw__auto svg+svg{display:block}

/* panel */
.rw__panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:44px 32px 18px}
.rw__panel-title{margin:0;font-weight:400;font-size:var(--rw-ph);line-height:1.1}
.rw__label{font-size:var(--rw-label);letter-spacing:.16em;text-transform:uppercase;color:#66625c;white-space:nowrap}
.rw__look-panel{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.rw__items{list-style:none;margin:0;padding:6px 32px 20px;display:flex;flex-direction:column;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;scrollbar-width:thin}
.rw__item{position:relative;display:grid;grid-template-columns:var(--rw-thumb) minmax(0,1fr) 44px;column-gap:18px;align-items:center;padding:18px 0;border-top:1px solid var(--rw-line)}
.rw__item:last-child{border-bottom:1px solid var(--rw-line)}
.rw__item::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:1px;background:var(--rw-accent);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--rw-ease)}
.rw__item.is-hot::after,.rw__item:hover::after{transform:scaleX(1)}
.rw__media{display:block;aspect-ratio:4/5;overflow:hidden;background:color-mix(in srgb,#151413 5%,#fff);position:relative}
.rw__media img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--rw-ease)}
.rw__item:hover .rw__media img{transform:scale(1.07)}
.rw__num{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.9);color:#151413;font-size:10px;font-weight:600;transition:background .3s,color .3s,transform .45s cubic-bezier(.2,1.6,.4,1)}
.rw__item.is-hot .rw__num,.rw__item:hover .rw__num{background:#0e0e0e;color:#fff;transform:scale(1.12)}
.rw__info{display:flex;flex-direction:column;gap:5px;min-width:0}
.rw__type{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#66625c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw__name{font-size:var(--rw-pt);font-weight:500;line-height:1.3;align-self:flex-start;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .7s var(--rw-ease)}
.rw__name:hover{background-size:100% 1px}
.rw__price{font-size:var(--rw-price);display:flex;gap:8px}
.rw__tag{position:absolute;top:11px;left:8px;z-index:2;display:flex;flex-direction:column;transform-origin:10px 0;pointer-events:none}
.rw__tag::before{content:"";width:1px;height:11px;margin-left:10px;background:color-mix(in srgb,#151413 50%,transparent)}
.rw__tag-text{background:#151413;color:#fff;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-radius:2px}
.rw__item:hover .rw__tag{animation:rw-swing 1.4s cubic-bezier(.3,.7,.4,1)}
@keyframes rw-swing{0%{transform:rotate(-16deg)}25%{transform:rotate(11deg)}45%{transform:rotate(-7deg)}65%{transform:rotate(4deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.rw__add{width:44px;height:44px;display:grid;align-self:end;border:0;background:none;cursor:pointer;position:relative}
.rw__add svg{grid-area:1/1;transition:transform .55s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.rw__add .ck,.rw__add .sp{opacity:0}
.rw__add::before{content:"";position:absolute;inset:4px;border-radius:var(--rw-add-radius);border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--rw-ease),opacity .4s}
.rw__item.is-picking .rw__add::before,.rw__add:hover::before{opacity:.22;transform:scale(1)}
.rw__item.is-picking .rw__add .pl{transform:rotate(45deg)}
.rw__item.is-loading .rw__add .pl{opacity:0}
.rw__item.is-loading .rw__add .sp{opacity:1;animation:rw-spin .8s linear infinite}
@keyframes rw-spin{to{transform:rotate(360deg)}}
.rw__item.is-added .rw__add .pl{opacity:0}
.rw__item.is-added .rw__add .ck{opacity:1;color:var(--rw-accent);animation:rw-pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes rw-pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

.rw__picker{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;padding-top:16px;animation:rw-drop .7s var(--rw-ease)}
@keyframes rw-drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.rw__picker-head{display:none}
.rw__opt{border:0;padding:0;margin:0}
.rw__opt-name{font-size:11px;color:#151413;margin-bottom:8px;padding:0}
.rw__pills{display:flex;flex-wrap:wrap;gap:8px}
.rw__pill{position:relative;display:inline-flex}
.rw__pill input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.rw__pill-label{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 14px;border-radius:var(--rw-pill-radius);border:1px solid var(--rw-line);background:transparent;color:#151413;font-size:11px;transition:background .3s,color .3s,border-color .3s,transform .45s var(--rw-ease-spring)}
.rw__pill:hover .rw__pill-label{border-color:#151413}
.rw__pill input:checked+.rw__pill-label{background:#151413;color:#fff;border-color:#151413}
.rw__pill input:active+.rw__pill-label{transform:scale(.94)}
.rw__confirm{min-height:46px;border:0;border-radius:0;background:#151413;color:#fff;font-size:11px;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden;cursor:pointer;animation:rw-rise .8s var(--rw-ease) .16s backwards}
@keyframes rw-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rw__confirm:hover{transform:translateY(-1px);transition:transform .4s cubic-bezier(.2,1.5,.4,1)}

/* bundle */
.rw__bundle{padding:20px 32px 30px;display:flex;flex-direction:column;gap:16px;background:#fff;border-top:1px solid var(--rw-line)}
.rw__msg{margin:0;font-size:11px;line-height:1.45;color:var(--rw-accent)}
.rw__bundle-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rw__bundle-copy{display:flex;flex-direction:column;gap:3px}
.rw__bundle-title{font-size:13px;font-weight:500}
.rw__bundle-note{font-size:11px;color:#66625c}
.rw__bundle-price{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.rw__bundle-price s{font-size:11px;color:#66625c}
.rw__bundle-price strong{font-weight:400;font-size:var(--rw-total)}
.rw__cta{position:relative;overflow:hidden;min-height:56px;width:100%;border:0;border-radius:0;background:#151413;color:#fff;font-size:13px;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:transform .6s var(--rw-ease),background .45s,color .45s,box-shadow .6s var(--rw-ease)}
.rw__cta:hover{transform:translateY(-2px);box-shadow:0 18px 34px -22px color-mix(in srgb,#151413 80%,transparent)}
.rw__cta:hover svg{transform:translateX(4px);transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.rw__cta-m,.rw__cta-done{display:none}
.rw__look-panel.is-complete .rw__cta{background:#0e0e0e}
.rw__look-panel.is-complete .rw__cta-add{display:none}
.rw__look-panel.is-complete .rw__cta-done{display:inline}

/* popup / lightbox */
.rw__lb{position:absolute;inset:0;z-index:40;visibility:hidden;pointer-events:none;transition:visibility 0s linear .95s}
.rw__lb::before{content:"";position:absolute;inset:0;background:var(--rw-stage);opacity:0;transition:opacity .6s var(--rw-ease) .15s}
.rw--zoom .rw__lb{visibility:visible;pointer-events:auto;transition:visibility 0s}
.rw--zoom .rw__lb::before{opacity:1;transition:opacity .45s}
.rw--zoom .rw__actors,.rw--zoom .rw__heroes,.rw--zoom .rw__head,.rw--zoom .rw__walk{opacity:0;pointer-events:none;transition:opacity .35s}
.rw__actors,.rw__heroes,.rw__head{transition:opacity .7s var(--rw-ease) .2s}
.rw__lb-stage{position:absolute;inset:88px 48px 48px;display:flex;align-items:flex-end;justify-content:center;cursor:zoom-out}
.rw__lb-model{position:relative;flex:0 0 auto;cursor:default;transition:transform .95s var(--rw-ease)}
.rw__lb-model .rw__figure{height:var(--rw-model-h)}
.rw__lb-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:16px;padding:32px 32px 0 56px;opacity:0;transform:translateY(-10px);transition:opacity .8s,transform 1s var(--rw-ease)}
.rw--zoom .rw__lb-top{opacity:1;transform:none;transition:opacity .8s .35s,transform 1s var(--rw-ease) .35s}
.rw__lb-cap{margin:0;display:flex;flex-direction:column;gap:4px}
.rw__lb-kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#66625c;font-variant-numeric:tabular-nums}
.rw__lb-name{font-weight:400;font-size:var(--rw-chip);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw__lb-close{width:48px;height:48px;border-radius:50%;border:1px solid color-mix(in srgb,#151413 22%,transparent);background:color-mix(in srgb,#fff 55%,transparent);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;transition:transform .6s var(--rw-ease),border-color .3s}
.rw__lb-close:hover{transform:rotate(90deg);border-color:#151413}
.rw__lb-hint{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#66625c;pointer-events:none;opacity:0;transition:opacity 1s var(--rw-ease) 1.1s}
.rw--zoom .rw__lb-hint{opacity:1}

/* custom cursor */
.rw__cursor{position:absolute;left:0;top:0;z-index:1700;pointer-events:none;width:0;height:0}
.rw__cursor-in{position:absolute;left:-42px;top:-42px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#151413;border:1px solid color-mix(in srgb,#151413 28%,transparent);background:color-mix(in srgb,#fff 40%,transparent);backdrop-filter:blur(6px);opacity:0;transform:scale(.3);transition:transform .6s var(--rw-ease),opacity .35s,background .35s,border-color .35s,color .35s}
.rw__cursor.is-on .rw__cursor-in{opacity:1;transform:scale(1)}
.rw__cursor-label{grid-area:1/1;font-size:10px;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity .25s,letter-spacing .7s var(--rw-ease)}
.rw__cursor .rw__cursor-drag{opacity:1}
.rw__cursor.is-view .rw__cursor-drag{opacity:0}
.rw__cursor.is-view .rw__cursor-view{opacity:1}
.rw--dragging .rw__cursor-in{transform:scale(.74);background:var(--rw-accent);border-color:var(--rw-accent);color:#fff}
.rw--dragging .rw__cursor-drag{letter-spacing:.42em}
.rw__cursor.is-link .rw__cursor-in{transform:scale(.2);background:var(--rw-accent);border-color:transparent}
.rw__cursor.is-link .rw__cursor-label{opacity:0}
.rw--cursor .rw__stage,.rw--cursor .rw__stage *{cursor:none}

/* walk line (mobile) */
.rw__walk{display:none}

/* bag dialog */
#bag-dialog{border:1px solid #d9d9d9;background:#fff;color:#151413;padding:24px;width:min(560px,100vw - 32px);max-height:85dvh;overflow:auto}
#bag-dialog::backdrop{background:#0005;backdrop-filter:blur(4px)}
.bag-heading{display:flex;justify-content:space-between;gap:20px}
.bag-heading h2{font-size:25px;font-weight:400;margin:0}
#close-bag{font-size:28px;width:44px;height:44px;background:none;border:0;cursor:pointer}
.bag-note{font-size:12px;color:#666;line-height:1.5}
.bag-row{display:grid;grid-template-columns:60px 1fr auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid #ddd}
.bag-row img{width:60px;height:80px;object-fit:contain}
.bag-row h3{font-size:14px;font-weight:400;margin:0 0 8px}
.bag-row p{font-size:12px;margin:0 0 6px}
.bag-row a{font-size:12px;text-decoration:underline;text-underline-offset:3px}
.bag-rm{font-size:20px;padding:12px;background:none;border:0;cursor:pointer}
#bag-total{text-align:right;font-size:15px;padding:12px 0}
#export-bag{background:#151413;color:#fff;border:0;padding:16px 20px;width:100%;cursor:pointer}
#export-bag:disabled{opacity:.4}

/* toast */
#bag-status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#151413;color:#fff;padding:12px 20px;font-size:12px;z-index:2147483002;opacity:0;transition:opacity .25s;pointer-events:none}
#bag-status.is-on{opacity:1}

/* reveal */
.rw--js .rw__title,.rw--js .rw__sub,.rw--js .rw__panel-head{opacity:0;transform:translateY(22px);filter:blur(8px)}
.rw--js .rw__stage,.rw--js .rw__controls,.rw--js .rw__panel{opacity:0}
.rw--js.is-revealed .rw__title{opacity:1;transform:none;filter:none;transition:opacity 1.1s var(--rw-ease) .12s,transform 1.4s var(--rw-ease) .12s,filter 1.1s var(--rw-ease) .12s}
.rw--js.is-revealed .rw__sub{opacity:1;transform:none;filter:none;transition:opacity 1.1s var(--rw-ease) .26s,transform 1.4s var(--rw-ease) .26s,filter 1.1s var(--rw-ease) .26s}
.rw--js.is-revealed .rw__panel-head{opacity:1;transform:none;filter:none;transition:opacity 1.1s var(--rw-ease) .34s,transform 1.4s var(--rw-ease) .34s,filter 1.1s var(--rw-ease) .34s}
.rw--js.is-revealed .rw__stage{opacity:1;transition:opacity 1.6s var(--rw-ease) .1s}
.rw--js.is-revealed .rw__panel{opacity:1;transition:opacity 1.2s var(--rw-ease) .25s}
.rw--js.is-revealed .rw__controls{opacity:1;transition:opacity 1.2s var(--rw-ease) .55s}

/* row entrance */
.rw__look-panel.is-in .rw__item{animation:rw-item-in 1.1s var(--rw-ease) backwards;animation-delay:calc(var(--i) * 85ms + 55ms)}
@keyframes rw-item-in{from{opacity:0;transform:translateY(26px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

/* mobile (simplified) */
@media (max-width:749px){
  .site-header{height:68px;padding:0 20px;gap:18px}
  .brand img{width:48px;height:17px}
  .site-header nav{gap:14px;font-size:11px}
  .site-header nav a:nth-child(2),.site-header nav a:nth-child(3){display:none}
  runway-section{--rw-h:24px;--rw-chip:18px;--rw-ph:16px;--rw-pt:12px;--rw-thumb:62px;--rw-panel-pad:20px}
  .rw__grid{display:flex;flex-direction:column;position:relative;overflow:hidden}
  .rw__left{flex:1 1 auto;z-index:1;padding-bottom:20px}
  .rw__head{flex-direction:column;align-items:stretch;gap:16px;padding:30px 20px 0}
  .rw__title{font-size:min(24px,11.5vw)}
  .rw__controls{display:none}
  .rw__panel{position:relative;z-index:2;flex:0 0 auto;border-left:0;margin-top:-20px;border-radius:20px 20px 0 0;background:#fff}
  .rw__panel-inner{position:static}
  .rw__panel-head{display:none}
  .rw__walk{display:block;position:absolute;left:50%;bottom:8px;z-index:1600;width:min(140px,38%);transform:translateX(-50%)}
  .rw__walk-line{position:relative;height:2px;background:color-mix(in srgb,#151413 14%,transparent);overflow:hidden}
  .rw__walk-line::after{content:"";position:absolute;inset:0;background:#0e0e0e;transform:scaleX(var(--rw-progress,.16));transform-origin:left;transition:transform 1.1s var(--rw-ease)}
  .rw__items{flex-direction:row;flex:0 0 auto;gap:0;padding:10px 20px 6px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
  .rw__item{flex:0 0 calc(100% - 64px);scroll-snap-align:start;margin-right:16px;padding:6px 16px 6px 0;column-gap:14px;border-top:0;border-right:1px solid var(--rw-line)}
  .rw__item:last-child{border-bottom:0;border-right:0;margin-right:0}
  .rw__bundle-price{display:none}
  .rw__cta-add,.rw__cta svg{display:none}
  .rw__cta-m{display:inline}
  .rw__look-panel.is-complete .rw__cta-m{display:none}
  .rw__lb{bottom:20px}
  .rw__lb-stage{inset:72px 16px 40px}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  .rw--js .rw__title,.rw--js .rw__sub,.rw--js .rw__panel-head,.rw--js .rw__stage,.rw--js .rw__controls,.rw--js .rw__panel{opacity:1;transform:none;filter:none}
}
</style>
</head>

<script>
const ASSET = 'https://reel-ref-try-the-look.vercel.app/assets/';
const STORE = 'https://nike-makknzjs.myshopify.com/products/';

/* ---- products ---- */
const SHOES=['40','41','42','43','44','45','46'];

function vmap(ids,vals){return vals.map((v,i)=>({id:ids[i],o:[v]}));}
const PRODUCTS={
 'tatum-5-orbit-copy':{name:'Air Jordan 12 Retro',vendor:'Nikey | Password: 1',price:149,img:'source-tatum-5-orbit-copy.webp',h:400,opt:'Shoe size',vals:SHOES,url:'tatum-5-orbit-copy',
   variants:vmap(['57015167025457','57015167058225','57015167090993','57015167123761','57015167156529','57015167189297','57015167222065'],SHOES)},
 'tshirt':{name:'Tshirt',vendor:'Nike',price:199,img:'source-tshirt.webp',h:563,opt:'Size',vals:APP,url:'tshirt',
   variants:vmap(['56835911582001','56835911614769','56835911647537','56835911680305'],APP)},
 'sweatshirt':{name:'Sweatshirt',vendor:'Nike',price:199,img:'source-sweatshirt.webp',h:581,opt:'Size',vals:APP,url:'sweatshirt',
   variants:vmap(['56835806396721','56835806429489','56835806462257','56835806495025'],APP)},
 'tatum-5-orbit':{name:'Tatum 5 Orbit',vendor:'Nikey | Password: 1',price:149,img:'source-tatum-5-orbit.webp',h:400,opt:'Shoe size',vals:SHOES,url:'tatum-5-orbit',
   variants:vmap(['57015166730545','57015166763313','57015166796081','57015166828849','57015166861617','57015166894385','57015166927153'],SHOES)},
 'hoodie-black':{name:'Hoodie Black',vendor:'Nike',price:199,img:'source-hoodie-black.webp',h:536,opt:'Size',vals:APP,url:'hoodie-black',
   variants:vmap(['56836251681073','56836251713841','56836251746609','56836251779377'],APP)},
 'sweatshirt-plus':{name:'Sweatshirt Plus',vendor:'Nike',price:199,img:'source-sweatshirt-plus.webp',h:610,opt:'Size',vals:APP,url:'sweatshirt-plus',
   variants:vmap(['56836143743281','56836143776049','56836143808817','56836143841585'],APP)},
 'hoodie':{name:'Hoodie',vendor:'Nike',price:199,img:'source-hoodie.webp',h:555,opt:'Size',vals:APP,url:'hoodie',
   variants:vmap(['56836002185521','56836002218289','56836002251057','56836002283825'],APP)},
 'air-jordan-12-retro-copy':{name:'Luka 5',vendor:'Nikey | Password: 1',price:149,img:'source-air-jordan-12-retro-copy.webp',h:536,opt:'Shoe size',vals:SHOES,url:'air-jordan-12-retro-copy',
   variants:vmap(['57015176364337','57015176397105','57015176429873','57015176462641','57015176495409','57015176528177','57015176560945'],SHOES)},
};
Object.keys(PRODUCTS).forEach(id=>{const p=PRODUCTS[id];p.id=id;p.image=ASSET+p.img;p.link=STORE+p.url;});

/* ---- looks ---- */
const LOOKS=[
 {key:'bndthK',name:'The City Edit',m:1,pieces:['tatum-5-orbit-copy','tshirt','sweatshirt'],tags:{},
  pins:[['Air Jordan 12 Retro',47,27],['Tshirt',48,58],['Sweatshirt',45,96]]},
 {key:'XckgG6',name:'Gallery Opening',m:5,pieces:['tatum-5-orbit','hoodie-black','tshirt'],tags:{1:'New'},
  pins:[['Tatum 5 Orbit',50,28],['Hoodie Black',48,58],['Tshirt',45,88]]},
 {key:'rLfAhC',name:'Gallery Opening',m:4,pieces:['sweatshirt-plus','tatum-5-orbit','tshirt'],tags:{1:'New'},
  pins:[['Sweatshirt Plus',50,28],['Tatum 5 Orbit',48,58],['Tshirt',45,88]]},
 {key:'FKg67q',name:'Studio Day',m:6,pieces:['hoodie-black','tatum-5-orbit-copy','tshirt'],tags:{},
  pins:[['Hoodie Black',50,28],['Air Jordan 12 Retro',48,58],['Tshirt',45,88]]},
 {key:'8KREEE',name:'Studio Day',m:3,pieces:['sweatshirt','tatum-5-orbit','tshirt'],tags:{},
  pins:[['Sweatshirt',50,28],['Tatum 5 Orbit',48,58],['Tshirt',45,88]]},
 {key:'N3bfm9',name:'Studio Day',m:2,pieces:['hoodie','air-jordan-12-retro-copy','tshirt'],tags:{},
  pins:[['Hoodie',50,28],['Luka 5',48,58],['Tshirt',45,88]]},
];
const n=LOOKS.length, N=n*Math.ceil(8/n); // 12
const pad=i=>String(i+1).padStart(2,'0');
const money=c=>'$'+c.toFixed(2);

/* ---- build DOM ---- */
const sec=document.getElementById('Runway');
const h=(s)=>{const t=document.createElement('template');t.innerHTML=s.trim();return t.content.firstElementChild;};

function modelImg(look,cls){
  return `<img src="${ASSET}model-${look.m}-640.webp" srcset="${ASSET}model-${look.m}-640.webp 640w, ${ASSET}original-look-${look.m}.webp 1080w" sizes="(min-width:1800px) 540px,(min-width:750px) 420px,320px" ${cls} decoding="async" width="1100" height="1956" draggable="false" data-model-image alt="${look.name}">`;
}
function pinsHTML(look){
  return look.pins.map((p,i)=>`<button class="rw__pin" data-rw-pin="${i+1}" data-tip="${p[0]}" style="left:${p[1]}%;top:${p[2]}%;--pi:${i+1}" aria-label="${i+1}: ${p[0]}" tabindex="-1"><span class="rw__pin-dot">${i+1}</span></button>`).join('');
}

const grid=h(`<div class="rw__sticky"><div class="rw__grid">
  <div class="rw__left">
    <div class="rw__head">
      <div class="rw__intro">
        <h2 class="rw__title">Try the Look.</h2>
        <p class="rw__sub">Six looks, styled head to toe. Tap a pin to see the piece.</p>
      </div>
      <span class="rw__sr" aria-live="polite" aria-atomic="true" data-rw-live></span>
    </div>
    <div class="rw__stage" data-rw-stage tabindex="0" role="region" aria-roledescription="carousel" aria-label="Try the Look. — use arrow keys or swipe to change look">
      <div class="rw__actors" data-rw-actors></div>
      <div class="rw__heroes" data-rw-heroes></div>
      <span class="rw__sweep"></span>
      <span class="rw__cursor" data-rw-cursor><span class="rw__cursor-in"><span class="rw__cursor-label rw__cursor-drag">Drag</span><span class="rw__cursor-label rw__cursor-view">View</span></span></span>
      <span class="rw__walk"><span class="rw__walk-line"></span></span>
      <div class="rw__lb" data-rw-lb data-word="Look" role="region" aria-label="View look" aria-hidden="true">
        <div class="rw__lb-stage" data-rw-lb-stage></div>
        <div class="rw__lb-top">
          <p class="rw__lb-cap"><span class="rw__lb-kicker" data-rw-lb-kicker></span><span class="rw__lb-name" data-rw-lb-name></span></p>
          <button class="rw__lb-close" data-rw-zoom-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
        </div>
        <p class="rw__lb-hint">Tap a dot to shop the piece</p>
      </div>
    </div>
    <div class="rw__controls">
      <button class="rw__icon" data-rw-prev aria-label="Previous look"><svg width="26" height="14" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M25 7H1M7 1L1 7l6 6"/></svg></button>
      <div class="rw__ticks"></div>
      <button class="rw__icon rw__auto" data-rw-auto aria-pressed="false" aria-label="Autoplay">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 4.5h3.5v15H6.5zM14 4.5h3.5v15H14z"/></svg>
      </button>
      <button class="rw__icon" data-rw-next aria-label="Next look"><svg width="26" height="14" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7h24M19 1l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div class="rw__panel has-rule"><div class="rw__panel-inner">
    <div class="rw__panel-head"><h3 class="rw__panel-title">In this look</h3><span class="rw__label" data-rw-pieces>3 pieces</span></div>
    <div class="rw__panels"></div>
  </div></div>
</div></div>`);
sec.appendChild(grid);

const actors=grid.querySelector('[data-rw-actors]');
const heroes=grid.querySelector('[data-rw-heroes]');
const ticksWrap=grid.querySelector('.rw__ticks');
const panelsWrap=grid.querySelector('.rw__panels');

// bodies 0..5
for(let a=0;a<n;a++){
  const look=LOOKS[a];
  const body=h(`<div class="rw__model" data-rw-model data-index="${a}" aria-hidden="true"><span class="rw__shadow"></span><div class="rw__figure" style="--rw-ar:.5625"><div class="rw__art">${modelImg(look,'loading="eager"')}<button class="rw__hit" data-rw-go="${a}" aria-label="Look ${a+1}: ${look.name}" tabindex="-1"></button></div></div></div>`);
  actors.appendChild(body);
}
// clones 6..11
for(let a=0;a<n;a++){
  const c=actors.children[a].cloneNode(true);
  c.setAttribute('data-rw-clone','');c.setAttribute('data-index',a+n);
  c.querySelectorAll('img').forEach(im=>im.setAttribute('loading','lazy'));
  actors.appendChild(c);
}
// heroes
LOOKS.forEach((look,i)=>{
  const hero=h(`<div class="rw__hero" data-rw-hero data-index="${i}" data-name="${look.name}" data-label="Look ${i+1}: ${look.name}" data-probe="${ASSET}model-${look.m}-640.webp"><div class="rw__morph"><span class="rw__shadow"></span><div class="rw__figure" style="--rw-ar:.5625"><div class="rw__art">${modelImg(look,'loading="eager"')}<button class="rw__zoom" data-rw-zoom aria-label="View look: ${look.name}" tabindex="-1"></button><div class="rw__pins">${pinsHTML(look)}</div></div></div></div></div>`);
  if(i===0)hero.classList.add('is-on');
  heroes.appendChild(hero);
});
// ticks
LOOKS.forEach((look,i)=>{
  const t=h(`<button class="rw__tick" data-rw-tick="${i}" aria-current="${i===0}" aria-label="Look ${i+1}: ${look.name}"><span class="rw__tick-bar"></span><span class="rw__tick-label">${pad(i)}<span class="rw__tick-name">&nbsp;&nbsp;${look.name}</span></span></button>`);
  ticksWrap.appendChild(t);
});
// panels
LOOKS.forEach((look,i)=>{
  const key=look.key;
  const items=look.pieces.map((pid,ri)=>{
    const p=PRODUCTS[pid];const num=ri+1;
    const tag=look.tags[ri]?`<span class="rw__tag"><span class="rw__tag-text">${look.tags[ri]}</span></span>`:'';
    const pickerId=`Picker-${key}-${num}`;
    const pills=p.vals.map((v,vi)=>`<label class="rw__pill"><input type="radio" name="Opt-${key}-${num}" value="${v}" ${vi===0?'checked':''} data-rw-option="0"><span class="rw__pill-label">${v}</span></label>`).join('');
    return `<li class="rw__item" data-rw-card="${num}" style="--i:${num}" data-title="${p.name}">
      ${tag}
      <a class="rw__media" href="${p.link}" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true"><img loading="lazy" decoding="async" alt="" width="400" height="${p.h}" src="${p.image}"><span class="rw__num">${num}</span></a>
      <div class="rw__info">
        <span class="rw__type">${p.vendor}</span>
        <a class="rw__name" href="${p.link}" target="_blank" rel="noopener noreferrer">${p.name}</a>

      <button class="rw__add" data-rw-add aria-expanded="false" aria-controls="${pickerId}" aria-label="Add to bag: ${p.name}" data-added-label="Added to bag: ${p.name}">
        <svg class="pl" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 4v16M4 12h16"/></svg>
        <svg class="ck" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 12.5l5 5L19.5 7"/></svg>
        <svg class="sp" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3a9 9 0 1 1-9 9"/></svg>
      </button>
      <div class="rw__picker" id="${pickerId}" data-rw-picker hidden data-product="${pid}">
        <fieldset class="rw__opt"><legend class="rw__opt-name">${p.opt}</legend><div class="rw__pills">${pills}</div></fieldset>
        <button class="rw__confirm" data-rw-confirm><span data-rw-confirm-label>Add to bag</span></button>
      </div>
    </li>`;
  }).join('');
  const panel=h(`<div class="rw__look-panel${i===0?' is-in':''}" data-rw-panel="${i}" ${i===0?'':'hidden'}>
    <ul class="rw__items" role="list">${items}</ul>
    <div class="rw__bundle has-rule">
      <p class="rw__msg" data-rw-msg role="status" aria-live="polite" hidden></p>
      <div class="rw__bundle-row">
        <div class="rw__bundle-copy"><span class="rw__bundle-title">Complete the look</span><span class="rw__bundle-note">Bundle all 3 and save 10%</span></div>
        <div class="rw__bundle-price"><s>$547.00</s><strong>$492.30</strong></div>
      </div>
      <button class="rw__cta" data-rw-all>
        <span class="rw__cta-add">Add full look to bag</span>
        <span class="rw__cta-m">Add full look — $492.30</span>
        <span class="rw__cta-done">Full look in your bag</span>
        <svg width="22" height="12" viewBox="0 0 26 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 7h24M19 1l6 6-6 6"/></svg>
      </button>
    </div>
  </div>`);
  panelsWrap.appendChild(panel);
});

/* ---- state ---- */
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let index=0,target=0,cur=reduce?0:-1.15,vel=0,still=false,dragging=false;
let W=1,H=1,fs=1,modelH=560,hx=0,hy=34,isPhone=false;
const bodies=[...actors.children];
bodies.forEach(b=>{b._prevBlur=null;b.w=0;});
sec.classList.add('rw--js');
const K=95,C=2*Math.sqrt(95);
const wrap=v=>{v=v%(Math.PI*2);if(v>Math.PI)v-=Math.PI*2;if(v<=-Math.PI)v+=Math.PI*2;return v;};
const wrapN=v=>((v%N)+N)%N;
const stage=grid.querySelector('.rw__stage');

/* cursor only on fine pointers */
const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
const cursorEl=grid.querySelector('[data-rw-cursor]');
if(fine){sec.classList.add('rw--cursor');}else{cursorEl.remove();}

/* ---- measure ---- */
function measure(){
  isPhone=innerWidth<=749;
  const headerH=document.querySelector('.site-header').getBoundingClientRect().height||88;
  const frameH=isPhone?(innerHeight*1.09):Math.max(380,innerHeight-headerH);
  grid.style.setProperty('--rw-frame-h',frameH+'px');
  const r=stage.getBoundingClientRect();W=r.width;H=r.height;
  fs=isPhone?1:1.08;
  if(isPhone){modelH=Math.max(200,Math.round(H-24-18));hx=0.3*W;hy=22;}
  else{modelH=Math.max(200,Math.round((H-34-18)/1.08));hx=0.5*W;hy=34;}
  stage.style.setProperty('--rw-model-h',modelH+'px');
  stage.style.setProperty('--rw-fs',fs);
  stage.style.setProperty('--rw-hx',hx+'px');
  stage.style.setProperty('--rw-hy',hy+'px');
  sec.style.setProperty('--rw-ax',(hx/W*100)+'%');
  sec.dataset.style=isPhone?'classic':'ring';
  bodies.forEach(b=>b.w=b.offsetWidth);
  renderAll();
}

/* ---- placement ---- */
function put(s,x,bottom,scale,opacity,blur,z){
  const w=s.w||1;
  if(x+w*scale/2<-4||x-w*scale/2>W+4)opacity=0;
  s.style.transform=`translate3d(${x}px,${-bottom}px,0) translateX(-50%) scale(${scale})`;
  s.style.opacity=opacity.toFixed(3);
  s.style.zIndex=z;
  s.style.visibility=opacity<0.01?'hidden':'';
  s.style.pointerEvents=opacity<0.5?'none':'';
  let b=Math.round(blur*10)/10;
  if(b<=0.05)b=0;
  if(b!==s._prevBlur){s.style.filter=b?`blur(${b}px)`:'';s._prevBlur=b;}
}
function renderRing(){
  const step=Math.PI*2/N,cx=0.5*W,R=0.62*W,P=1.65*W,floor=H-34,horizon=0.36*H;
  for(let a=0;a<bodies.length;a++){
    const phi=wrap((a-cur)*step);
    const z=R*(1-Math.cos(phi)),persp=P/(P+z),sl=Math.abs(phi)/step;
    const scale=persp*(1+(fs-1)*Math.max(0,Math.min(1,1-sl)));
    const x=cx+R*Math.sin(phi)*persp;
    const feet=horizon+(floor-horizon)*persp,bottom=H-feet;
    const blur=sl<=1?1.8*sl:Math.min(1.8+(sl-1)*2,6.5);
    let op=Math.max(0,Math.min(1,(Math.cos(phi)+0.55)/0.3));
    if(still&&sl<0.02)op=0;
    put(bodies[a],x,bottom,scale,op,blur,Math.round(scale*1000));
  }
}
function renderClassic(){
  const ax=0.3,ay=22,sx=0.32,sy=22,sr=0.76;
  for(let a=0;a<bodies.length;a++){
    const k=wrapN(a-cur);
    const x=W*(ax+sx*k),bottom=ay+sy*k,scale=Math.pow(sr,k);
    let op=k<=3?1-0.13*k:Math.max(0,0.61*(4-k));
    if(still&&k<0.02)op=0;
    const blur=Math.min(0.9*k,3.2);
    put(bodies[a],x,bottom,scale,op,blur,1000-Math.round(10*k));
  }
}
function renderAll(){isPhone?renderClassic():renderRing();}

/* ---- loop ---- */
let raf=0,last=0,visible=true;
function setStill(v){if(still===v)return;still=v;sec.classList.toggle('rw--still',v);}
function frame(now){
  const dt=last?Math.min(0.034,(now-last)/1000):1/60;last=now;
  const hstep=dt/3;
  for(let i=0;i<3;i++){const acc=-K*(cur-target)-C*vel;vel+=acc*hstep;cur+=vel*hstep;}
  if(Math.abs(cur-target)<=5e-4&&Math.abs(vel)<=5e-4){cur=target;vel=0;renderAll();if(!dragging){setStill(true);raf=0;last=0;return;}}
  renderAll();
  raf=requestAnimationFrame(frame);
}
function kick(){if(!raf&&visible&&!document.hidden){setStill(false);last=0;raf=requestAnimationFrame(frame);}}

/* ---- navigation ---- */
function setIndex(i,silent){
  const changed=i!==index;
  index=i;
  // hero toggle
  heroes.querySelectorAll('.rw__hero').forEach((hr,j)=>{
    hr.classList.toggle('is-on',j===i);
    hr.classList.toggle('was',false);
    hr.setAttribute('aria-hidden',j!==i);
    const z=hr.querySelector('[data-rw-zoom]');if(z)z.tabIndex=j===i?0:-1;
  });
  // ticks
  ticksWrap.querySelectorAll('.rw__tick').forEach((t,j)=>{t.setAttribute('aria-current',j===i);t.classList.toggle('is-past',j<i);});
  // panels
  panelsWrap.querySelectorAll('.rw__look-panel').forEach((p,j)=>{
    if(j===i){p.hidden=false;p.classList.remove('is-in');void p.offsetWidth;p.classList.add('is-in');}
    else{p.hidden=true;p.classList.remove('is-in');}
  });
  if(!silent){
    if(!reduce){sec.classList.remove('rw--sweep');void stage.offsetWidth;sec.classList.add('rw--sweep');}
    grid.querySelector('[data-rw-live]').textContent=`Look ${i+1}: ${LOOKS[i].name}`;
    sec.style.setProperty('--rw-progress',((i+1)/6).toFixed(3));
    closePopup();
  }
  clearHot();
  restartBar();
}
function moveTo(T){target=T;setStill(false);setIndex(((T%n)+n)%n);kick();}
function next(){moveTo(Math.round(target)+1);}
function prev(){moveTo(Math.round(target)-1);}
function go(i){let d=(i-index)%n;if(d>n/2)d-=n;moveTo(Math.round(target)+d);}

/* ---- autoplay ---- */
let playing=false,timer=0,engaged=false,panelHover=false,zoomed=false;
function restartBar(){
  const t=ticksWrap.querySelectorAll('.rw__tick');

  void ticksWrap.offsetWidth;
  if(playing&&t[index])t[index].classList.add('is-run');

}
function tick(){
  if(playing&&visible&&!dragging&&!document.hidden&&!panelHover&&!zoomed&&!engaged)next();

}
function play(on){

/* ---- drag / swipe ---- */
let ds=null;
stage.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.target.closest('.rw__lb'))return;
  ds={x:e.clientX,y:e.clientY,t:target,id:e.pointerId,samples:[{x:e.clientX,time:performance.now()}],drag:false};
});
stage.addEventListener('pointermove',e=>{
  if(ds){
    const dx=e.clientX-ds.x,dy=e.clientY-ds.y;
    if(!ds.drag){
      if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){ds=null;return;}
      if(Math.abs(dx)>8&&Math.abs(dx)>1.2*Math.abs(dy)){ds.drag=true;dragging=true;sec.classList.add('rw--dragging');try{stage.setPointerCapture(ds.id);}catch(_){}}
    }
    if(ds.drag){
      const unit=isPhone?Math.max(90,W*0.32*1.6):Math.max(120,0.3*W);
      target=ds.t-dx/unit;
      ds.samples.push({x:e.clientX,time:performance.now()});if(ds.samples.length>6)ds.samples.shift();
      kick();
    }
  }
  if(fine)moveCursor(e);
});
function endDrag(e){
  if(!ds)return;const d=ds;ds=null;
  if(d.drag){
    dragging=false;sec.classList.remove('rw--dragging');
    const first=d.samples[0],lastS=d.samples[d.samples.length-1];
    const dt=(lastS.time-first.time)||1,vx=(lastS.x-first.x)/dt;
    const dx=e.clientX-d.x,from=Math.round(d.t),unit=isPhone?Math.max(90,W*0.32*1.6):Math.max(120,0.3*W);
    if(isPhone){
      if(Math.abs(dx)>30||Math.abs(vx)>0.3)moveTo(from+(dx>0?-1:1));else moveTo(from);
    }else{
      let i=Math.round(target+(-1)*vx*160/unit);
      if(i===from&&Math.abs(vx)>0.3)i=from+(vx>0?-1:1);
      i=Math.max(from-2,Math.min(from+2,i));moveTo(i);
    }
    d.suppress=performance.now();lastDrag=performance.now();
  }
}
let lastDrag=0;
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);
stage.addEventListener('click',e=>{if(performance.now()-lastDrag<60){e.stopPropagation();e.preventDefault();}},true);

/* ---- custom cursor ---- */
let cx2=0,cy2=0,tx=0,ty=0,cOn=false,craf=0;
function moveCursor(e){
  const r=stage.getBoundingClientRect();tx=e.clientX-r.left;ty=e.clientY-r.top;

function lerpCursor(){

/* ---- feet detection ---- */
function detectFeet(){
  heroes.querySelectorAll('.rw__hero').forEach(hero=>{
    const url=hero.dataset.probe;const img=new Image();img.crossOrigin='anonymous';
    img.onload=()=>{try{
      const cw=48,ch=Math.round(cw*img.naturalHeight/img.naturalWidth);
      const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cw,ch);
      const d=ctx.getImageData(0,0,cw,ch).data;let lastRow=ch-1;
      for(let y=ch-1;y>=0;y--){let any=false;for(let x=0;x<cw;x++){if(d[(y*cw+x)*4+3]>40){any=true;break;}}if(any){lastRow=y;break;}}
      const foot=Math.max(0,Math.min(0.4,(ch-1-lastRow)/ch));
      const i=+hero.dataset.index;
      hero.style.setProperty('--rw-foot',foot);
      bodies.forEach(b=>{if(+b.dataset.index%n===i)b.style.setProperty('--rw-foot',foot);});
    }catch(_){}};
    img.src=url;
  });
}

  else im.addEventListener('load',()=>{(im.decode?im.decode().then(mark).catch(mark):mark());},{once:true});
});

const rio=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
